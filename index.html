<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏎️ Road Rush</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Exo 2', sans-serif;
    overflow: hidden;
  }

  h1 {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 6px;
    color: #ff3c00;
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.9;
  }

  #wrapper {
    position: relative;
    width: 480px;
  }

  canvas {
    display: block;
    width: 480px;
    height: 580px;
    border-radius: 4px;
    border: 1px solid #1e1e2e;
    image-rendering: pixelated;
  }

  #controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    gap: 12px;
    background: #0f0f1a;
    border: 1px solid #1e1e2e;
    border-radius: 4px;
    padding: 10px 16px;
  }

  .speed-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
  }

  .speed-label {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: #555577;
    text-transform: uppercase;
  }

  input[type=range] {
    -webkit-appearance: none;
    flex: 1;
    height: 3px;
    background: #1e1e30;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #ff3c00;
    border: 2px solid #ff6a3d;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(255,60,0,0.6);
  }

  #speedVal {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    color: #ff3c00;
    min-width: 20px;
    text-align: right;
  }

  #stats {
    display: flex;
    gap: 16px;
  }

  .stat {
    text-align: center;
  }
  .stat-label {
    font-size: 8px;
    letter-spacing: 2px;
    color: #333355;
    text-transform: uppercase;
    font-family: 'Orbitron', monospace;
    display: block;
  }
  .stat-val {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    font-weight: 700;
    color: #e0e0ff;
    display: block;
  }

  #startBtn {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    padding: 8px 16px;
    background: transparent;
    border: 1px solid #ff3c00;
    color: #ff3c00;
    cursor: pointer;
    border-radius: 2px;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  #startBtn:hover {
    background: #ff3c00;
    color: #fff;
    box-shadow: 0 0 12px rgba(255,60,0,0.4);
  }

  #keys-hint {
    font-size: 9px;
    letter-spacing: 1px;
    color: #2a2a44;
    text-align: center;
    margin-top: 6px;
    font-family: 'Orbitron', monospace;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<h1>Road Rush</h1>
<div id="wrapper">
  <canvas id="gc" width="480" height="580"></canvas>
  <div id="controls">
    <div class="speed-group">
      <span class="speed-label">Speed</span>
      <input type="range" id="speedSlider" min="1" max="10" value="4" step="1">
      <span id="speedVal">4</span>
    </div>
    <div id="stats">
      <div class="stat"><span class="stat-label">Score</span><span class="stat-val" id="scoreEl">0</span></div>
      <div class="stat"><span class="stat-label">Best</span><span class="stat-val" id="hiEl">0</span></div>
    </div>
    <button id="startBtn" onclick="toggleGame()">START</button>
  </div>
  <p id="keys-hint">← → Arrow keys &nbsp;|&nbsp; A / D keys &nbsp;|&nbsp; Touch swipe</p>
</div>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
const W = 480, H = 580;
canvas.width = W; canvas.height = H;

// ---- State ----
let state = 'idle'; // idle | running | over
let score = 0, hiScore = 0, frame = 0;
let speedLevel = 4;

// ---- Road geometry ----
const RL = 100, RR = 380, RW = RR - RL;
const LC = (RL + RR) / 2;

// ---- Car ----
let car = { x: LC, y: H - 110, w: 38, h: 68 };
const CSPEED = 5.5;

// ---- Road objects ----
let dashes = [], trees = [], obstacles = [], particles = [], coins = [];
let obstTimer = 0, coinTimer = 0;
let coinScore = 0;

function getSpeed() { return speedLevel * 1.3; }

document.getElementById('speedSlider').oninput = function() {
  speedLevel = +this.value;
  document.getElementById('speedVal').textContent = speedLevel;
};

function toggleGame() {
  if (state === 'idle' || state === 'over') startGame();
  else { endGame('STOPPED'); }
}

function startGame() {
  state = 'running';
  score = 0; frame = 0;
  car = { x: LC, y: H - 110, w: 38, h: 68 };
  obstacles = []; particles = []; coins = []; obstTimer = 0; coinTimer = 0; coinScore = 0;
  dashes = Array.from({length:10}, (_,i) => ({ y: i * 72 - 20 }));
  trees = [];
  for (let i = 0; i < 10; i++) spawnTree(i * 75 - 40);
  document.getElementById('startBtn').textContent = 'STOP';
}

function endGame(reason) {
  state = 'over';
  if (coinScore > hiScore) hiScore = coinScore;
  document.getElementById('hiEl').textContent = hiScore;
  document.getElementById('startBtn').textContent = 'RETRY';
  spawnCrash(car.x, car.y);
}

// ---- Spawners ----
function spawnTree(startY) {
  const side = Math.random() < 0.5 ? 'L' : 'R';
  const x = side === 'L' ? 18 + Math.random() * 60 : RR + 20 + Math.random() * 60;
  trees.push({ x, y: startY ?? -40, h: 28 + Math.random() * 18, side, col: `hsl(${118+Math.random()*18},${38+Math.random()*15}%,${22+Math.random()*12}%)` });
}

function spawnObstacle() {
  const laneX = [RL + 50, LC, RR - 50];
  const x = laneX[Math.floor(Math.random() * 3)] + (Math.random()-0.5)*20;
  const cols = ['#c8312a','#1a5fa8','#1a7a4a','#b87010','#8a2070','#444466'];
  obstacles.push({ x, y: -80, w: 36, h: 64, col: cols[Math.floor(Math.random()*cols.length)], spd: getSpeed() * (0.65 + Math.random() * 0.45) });
}

function spawnCrash(x, y) {
  for (let i = 0; i < 32; i++) {
    const a = (i / 32) * Math.PI * 2;
    const s = 1.5 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(a)*s*(0.5+Math.random()), vy: Math.sin(a)*s*(0.5+Math.random()), life: 1, col: ['#ff3c00','#ffaa00','#fff','#ffdd55'][i%4], size: 3+Math.random()*5 });
  }
}

function spawnCoin() {
  const laneX = [RL + 50, LC - 40, LC, LC + 40, RR - 50];
  const x = laneX[Math.floor(Math.random() * laneX.length)] + (Math.random()-0.5)*16;
  // occasionally spawn a cluster of 3
  const count = Math.random() < 0.25 ? 3 : 1;
  for (let i = 0; i < count; i++) {
    coins.push({ x: x + (i - (count-1)/2) * 36, y: -20 - i * 38, r: 11, angle: Math.random()*Math.PI*2, spin: 0.06 + Math.random()*0.04 });
  }
}

function spawnCoinCollect(x, y) {
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    particles.push({ x, y, vx: Math.cos(a)*2.5, vy: Math.sin(a)*2.5 - 1, life: 1, col: ['#ffdd57','#ffaa00','#ffe97a','#fff'][i%4], size: 2.5 + Math.random()*2, type: 'coin' });
  }
  // floating +1 text particle
  particles.push({ x, y, vx: 0, vy: -1.8, life: 1, col: '#ffdd57', size: 13, type: 'text' });
}
const keys = {};
document.addEventListener('keydown', e => { keys[e.key] = true; e.preventDefault && ['ArrowLeft','ArrowRight'].includes(e.key) && e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.key] = false; });

let touchX0 = null;
canvas.addEventListener('touchstart', e => { touchX0 = e.touches[0].clientX; e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove', e => {
  if (!touchX0) return;
  const dx = e.touches[0].clientX - touchX0;
  keys['ArrowLeft'] = dx < -8;
  keys['ArrowRight'] = dx > 8;
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchend', () => { keys['ArrowLeft'] = keys['ArrowRight'] = false; touchX0 = null; });

// ---- Update ----
function update() {
  if (state !== 'running') {
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += (p.type === 'text' ? 0 : 0.1); p.life -= (p.type === 'text' ? 0.022 : 0.032); });
    particles = particles.filter(p => p.life > 0);
    return;
  }
  frame++;

  const spd = getSpeed();

  // Move car
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) car.x -= CSPEED;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) car.x += CSPEED;
  car.x = Math.max(RL + car.w/2 + 2, Math.min(RR - car.w/2 - 2, car.x));

  // Off-road
  if (car.x - car.w/2 < RL + 1 || car.x + car.w/2 > RR - 1) { endGame('OFF ROAD'); return; }

  // Dashes
  dashes.forEach(d => { d.y += spd; if (d.y > H + 40) d.y -= 10 * 72; });

  // Trees
  trees.forEach(t => { t.y += spd * 0.85; });
  trees = trees.filter(t => t.y < H + 60);
  while (trees.length < 12) spawnTree();

  // Obstacles
  obstTimer++;
  const interval = Math.max(30, 80 - speedLevel * 4);
  if (obstTimer >= interval) { spawnObstacle(); obstTimer = 0; }
  obstacles.forEach(o => { o.y += spd * 0.78; });
  obstacles = obstacles.filter(o => o.y < H + 100);

  // Coins
  coinTimer++;
  if (coinTimer >= 55) { spawnCoin(); coinTimer = 0; }
  coins.forEach(c => { c.y += spd * 0.78; c.angle += c.spin; });
  coins = coins.filter(c => c.y < H + 30);
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    if (Math.abs(car.x - c.x) < car.w*0.5 + c.r && Math.abs(car.y - c.y) < car.h*0.5 + c.r) {
      coinScore++;
      if (coinScore > hiScore) hiScore = coinScore;
      spawnCoinCollect(c.x, c.y);
      coins.splice(i, 1);
    }
  }

  // Particles
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += (p.type === 'text' ? 0 : 0.1); p.life -= (p.type === 'text' ? 0.022 : 0.032); });
  particles = particles.filter(p => p.life > 0);

  // Collision
  for (let o of obstacles) {
    if (Math.abs(car.x - o.x) < (car.w + o.w) * 0.43 && Math.abs(car.y - o.y) < (car.h + o.h) * 0.43) {
      endGame('CRASH'); return;
    }
  }

  document.getElementById('scoreEl').textContent = coinScore;
  document.getElementById('hiEl').textContent = hiScore;
}

// ---- Draw helpers ----
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

function lerpCol(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ar = (pa>>16)&255, ag = (pa>>8)&255, ab = pa&255;
  const br = (pb>>16)&255, bg = (pb>>8)&255, bb = pb&255;
  const r = Math.round(ar + (br-ar)*t), g = Math.round(ag + (bg-ag)*t), bv = Math.round(ab + (bb-ab)*t);
  return `rgb(${r},${g},${bv})`;
}

function drawRoad() {
  // Sky gradient (static)
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.18);
  sky.addColorStop(0, '#05050d');
  sky.addColorStop(1, '#0a0a18');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H * 0.18);

  // Horizon line
  ctx.fillStyle = '#0f0f22';
  ctx.fillRect(0, H * 0.18, W, 2);

  // Ground (perspective gradient)
  const gnd = ctx.createLinearGradient(0, H * 0.18, 0, H);
  gnd.addColorStop(0, '#3a6b2a');
  gnd.addColorStop(0.3, '#2e5522');
  gnd.addColorStop(1, '#1a3314');
  ctx.fillStyle = gnd;
  ctx.fillRect(0, H * 0.18, W, H);

  // Grass texture lines
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1;
  for (let x = 0; x < RL; x += 12) { ctx.beginPath(); ctx.moveTo(x,H*0.18); ctx.lineTo(x,H); ctx.stroke(); }
  for (let x = RR; x < W; x += 12) { ctx.beginPath(); ctx.moveTo(x,H*0.18); ctx.lineTo(x,H); ctx.stroke(); }

  // Road surface
  const rdg = ctx.createLinearGradient(0, H * 0.18, 0, H);
  rdg.addColorStop(0, '#2a2a3a');
  rdg.addColorStop(0.5, '#303040');
  rdg.addColorStop(1, '#252535');
  ctx.fillStyle = rdg;
  ctx.fillRect(RL, 0, RW, H);

  // Road grain texture
  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  for (let y = 0; y < H; y += 5) ctx.fillRect(RL, y, RW, 2.5);

  // Asphalt crack lines (static decoration)
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 0.5;
  [[LC-30, 80, LC-45, 200],[LC+25, 150, LC+40, 310],[LC-10, 340, LC+15, 480]].forEach(([x1,y1,x2,y2]) => {
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });

  // Kerb stripes L & R
  for (let y = 0; y < H; y += 22) {
    const even = Math.floor(y / 22) % 2 === 0;
    ctx.fillStyle = even ? '#cc2222' : '#eeeeee';
    ctx.fillRect(RL - 14, y, 14, 22);
    ctx.fillStyle = even ? '#cc2222' : '#eeeeee';
    ctx.fillRect(RR, y, 14, 22);
  }
  // Kerb shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(RL - 14, 0, 3, H);
  ctx.fillRect(RR + 11, 0, 3, H);

  // White edge lines
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(RL, 0); ctx.lineTo(RL, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(RR, 0); ctx.lineTo(RR, H); ctx.stroke();

  // Center lane dashes
  ctx.strokeStyle = '#ffdd57';
  ctx.lineWidth = 2;
  ctx.setLineDash([32, 26]);
  dashes.forEach(d => {
    ctx.beginPath(); ctx.moveTo(LC - RW/6, d.y); ctx.lineTo(LC - RW/6, d.y + 45); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(LC + RW/6, d.y); ctx.lineTo(LC + RW/6, d.y + 45); ctx.stroke();
  });
  ctx.setLineDash([]);
}

function drawTree(t) {
  const ts = t.h;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(t.x + 5, t.y + ts * 0.55, ts * 0.55, ts * 0.16, 0, 0, Math.PI*2); ctx.fill();
  // Trunk
  ctx.fillStyle = '#6b4520';
  ctx.fillRect(t.x - 4, t.y + ts * 0.28, 8, ts * 0.5);
  // Foliage 3 layers
  const g = t.col;
  const lighten = (c, a) => { ctx.globalAlpha = a; ctx.fillStyle = '#7fc855'; };
  ctx.fillStyle = g; ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(t.x, t.y + ts * 0.22, ts * 0.82, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = g; ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.arc(t.x - ts*0.28, t.y, ts * 0.6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3d7a2a'; ctx.globalAlpha = 0.9;
  ctx.beginPath(); ctx.arc(t.x + ts*0.22, t.y - ts*0.05, ts * 0.62, 0, Math.PI*2); ctx.fill();
  // Highlight
  ctx.fillStyle = 'rgba(160,220,100,0.18)';
  ctx.beginPath(); ctx.arc(t.x - ts*0.2, t.y - ts*0.25, ts * 0.3, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawCar(x, y, w, h, col, isPlayer) {
  // Ground shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(x+3, y + h*0.44, w*0.46, h*0.12, 0, 0, Math.PI*2); ctx.fill();

  // Body
  ctx.fillStyle = col;
  rr(x - w/2, y - h/2, w, h, 7); ctx.fill();

  // Body highlight (top edge)
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  rr(x - w/2 + 2, y - h/2 + 2, w - 4, h * 0.22, 4); ctx.fill();

  // Cabin
  const cabCol = isPlayer ? '#1a3a5c' : '#1a2a40';
  ctx.fillStyle = cabCol;
  if (isPlayer) {
    rr(x - w*0.37, y - h*0.31, w*0.74, h*0.43, 5); ctx.fill();
  } else {
    rr(x - w*0.37, y - h*0.12, w*0.74, h*0.43, 5); ctx.fill();
  }

  // Windshield
  ctx.fillStyle = isPlayer ? 'rgba(140,210,255,0.82)' : 'rgba(120,180,230,0.65)';
  if (isPlayer) {
    rr(x - w*0.28, y - h*0.27, w*0.56, h*0.2, 3); ctx.fill();
    // Windshield reflection
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.ellipse(x - w*0.08, y - h*0.2, w*0.08, h*0.04, -0.3, 0, Math.PI*2); ctx.fill();
  } else {
    rr(x - w*0.28, y - h*0.08, w*0.56, h*0.2, 3); ctx.fill();
  }

  // Rear/front lights
  if (isPlayer) {
    // Headlights (bottom = front)
    ctx.fillStyle = '#ffee66';
    ctx.shadowColor = '#ffdd00'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.ellipse(x - w*0.3, y + h/2 - 9, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + w*0.3, y + h/2 - 9, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // Taillights (top)
    ctx.fillStyle = '#cc1111';
    ctx.beginPath(); ctx.ellipse(x - w*0.3, y - h/2 + 9, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + w*0.3, y - h/2 + 9, 5, 3, 0, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = '#ff3333';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.ellipse(x - w*0.3, y + h/2 - 9, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + w*0.3, y + h/2 - 9, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Wheels
  const wheelPos = [[-w*0.38, -h*0.31],[w*0.38, -h*0.31],[-w*0.38, h*0.27],[w*0.38, h*0.27]];
  wheelPos.forEach(([dx,dy]) => {
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(x+dx, y+dy, 7, 10, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.ellipse(x+dx, y+dy, 4, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#666';
    ctx.beginPath(); ctx.arc(x+dx, y+dy, 2, 0, Math.PI*2); ctx.fill();
  });

  // Player racing stripe
  if (isPlayer) {
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    rr(x - w*0.1, y - h*0.46, w*0.2, h*0.38, 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,60,0,0.5)';
    rr(x - w*0.1 + 3, y - h*0.46, 4, h*0.38, 2); ctx.fill();
  }
}

function drawCoin(c) {
  const scaleX = Math.abs(Math.cos(c.angle));
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(scaleX, 1);

  // Outer glow
  ctx.shadowColor = '#ffcc00';
  ctx.shadowBlur = 10;

  // Coin body
  const grad = ctx.createRadialGradient(-c.r*0.3, -c.r*0.3, 1, 0, 0, c.r);
  grad.addColorStop(0, '#fff7a0');
  grad.addColorStop(0.35, '#ffd700');
  grad.addColorStop(0.75, '#e6a800');
  grad.addColorStop(1, '#b87800');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI*2); ctx.fill();

  ctx.shadowBlur = 0;

  // Inner ring
  ctx.strokeStyle = 'rgba(255,220,50,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, c.r * 0.7, 0, Math.PI*2); ctx.stroke();

  // $ symbol
  ctx.fillStyle = '#b87800';
  ctx.font = `bold ${Math.round(c.r * 1.1)}px Orbitron, monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('$', 0, 1);
  ctx.textBaseline = 'alphabetic';

  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    if (p.type === 'text') {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.col;
      ctx.font = `bold ${p.size}px Orbitron, monospace`;
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 6;
      ctx.fillText('+1', p.x, p.y);
      ctx.shadowBlur = 0;
    } else {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.col;
      ctx.shadowColor = p.col; ctx.shadowBlur = 4;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  });
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

function drawHUD() {
  // Speed gauge box
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  rr(W - 94, 10, 84, 42, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(255,60,0,0.4)'; ctx.lineWidth = 0.5;
  rr(W - 94, 10, 84, 42, 6); ctx.stroke();
  ctx.fillStyle = '#ff3c00';
  ctx.font = 'bold 11px Orbitron, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`${speedLevel * 40} km/h`, W - 52, 26);
  ctx.fillStyle = 'rgba(255,60,0,0.5)';
  ctx.font = '8px Orbitron, monospace';
  ctx.fillText('SPEED', W - 52, 40);

  // Coin score box
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  rr(10, 10, 90, 42, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(255,215,0,0.4)'; ctx.lineWidth = 0.5;
  rr(10, 10, 90, 42, 6); ctx.stroke();
  // coin icon
  ctx.fillStyle = '#ffd700';
  ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 5;
  ctx.beginPath(); ctx.arc(28, 26, 7, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#b87800';
  ctx.font = 'bold 8px Orbitron, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('$', 28, 29);
  ctx.fillStyle = '#ffdd57';
  ctx.font = 'bold 14px Orbitron, monospace';
  ctx.fillText(`${coinScore}`, 68, 28);
  ctx.fillStyle = 'rgba(255,215,0,0.45)';
  ctx.font = '8px Orbitron, monospace';
  ctx.fillText('COINS', 68, 42);
}

function drawOverlay(msg, sub) {
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';

  // Title
  ctx.fillStyle = msg === 'ROAD RUSH' ? '#ff3c00' : '#ff3c00';
  ctx.font = 'bold 38px Orbitron, monospace';
  ctx.shadowColor = '#ff3c00'; ctx.shadowBlur = 16;
  ctx.fillText(msg, W/2, H/2 - 30);
  ctx.shadowBlur = 0;

  // Sub
  if (sub) {
    ctx.fillStyle = 'rgba(200,200,255,0.75)';
    ctx.font = '13px Orbitron, monospace';
    ctx.fillText(sub, W/2, H/2 + 14);
  }

  if (state === 'over') {
    ctx.fillStyle = '#ffdd57';
    ctx.font = 'bold 16px Orbitron, monospace';
    ctx.fillText(`COINS  ${coinScore}   BEST  ${hiScore}`, W/2, H/2 + 46);
  }

  ctx.textAlign = 'left';
}

// ---- Main loop ----
function loop() {
  update();

  ctx.clearRect(0, 0, W, H);
  drawRoad();
  trees.sort((a,b) => a.y - b.y).forEach(drawTree);
  obstacles.forEach(o => drawCar(o.x, o.y, o.w, o.h, o.col, false));
  coins.forEach(drawCoin);
  if (state !== 'idle') drawCar(car.x, car.y, car.w, car.h, '#d42020', true);
  drawParticles();

  if (state === 'running') drawHUD();
  if (state === 'idle') drawOverlay('ROAD RUSH', '← → 키로 조종 | 도로 이탈 / 충돌 시 게임 오버');
  if (state === 'over') drawOverlay('GAME OVER', '도로 이탈 또는 충돌!');

  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
