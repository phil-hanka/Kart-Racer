<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏎️ Road Rush</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Exo 2', sans-serif;
    overflow: hidden;
  }

  h1 {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    letter-spacing: 6px;
    color: #ff3c00;
    text-transform: uppercase;
    margin-bottom: 8px;
    opacity: 0.9;
  }

  #wrapper {
    position: relative;
    width: 480px;
  }

  canvas {
    display: block;
    width: 480px;
    height: 580px;
    border-radius: 4px;
    border: 1px solid #1e1e2e;
    image-rendering: pixelated;
  }

  #controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
    gap: 12px;
    background: #0f0f1a;
    border: 1px solid #1e1e2e;
    border-radius: 4px;
    padding: 10px 16px;
  }

  .speed-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
  }

  .speed-label {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    color: #555577;
    text-transform: uppercase;
  }

  input[type=range] {
    -webkit-appearance: none;
    flex: 1;
    height: 3px;
    background: #1e1e30;
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: #ff3c00;
    border: 2px solid #ff6a3d;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(255,60,0,0.6);
  }

  #speedVal {
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    color: #ff3c00;
    min-width: 60px;
    text-align: right;
  }

  #stats {
    display: flex;
    gap: 16px;
  }

  .stat {
    text-align: center;
  }
  .stat-label {
    font-size: 8px;
    letter-spacing: 2px;
    color: #333355;
    text-transform: uppercase;
    font-family: 'Orbitron', monospace;
    display: block;
  }
  .stat-val {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    font-weight: 700;
    color: #e0e0ff;
    display: block;
  }

  #startBtn {
    font-family: 'Orbitron', monospace;
    font-size: 9px;
    letter-spacing: 2px;
    padding: 8px 16px;
    background: transparent;
    border: 1px solid #ff3c00;
    color: #ff3c00;
    cursor: pointer;
    border-radius: 2px;
    text-transform: uppercase;
    transition: all 0.15s;
  }
  #startBtn:hover {
    background: #ff3c00;
    color: #fff;
    box-shadow: 0 0 12px rgba(255,60,0,0.4);
  }

  #keys-hint {
    font-size: 9px;
    letter-spacing: 1px;
    color: #2a2a44;
    text-align: center;
    margin-top: 6px;
    font-family: 'Orbitron', monospace;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<h1>Road Rush</h1>
<div id="wrapper">
  <canvas id="gc" width="480" height="580"></canvas>
  <div id="controls">
    <div class="speed-group">
      <span class="speed-label">Speed</span>
      <input type="range" id="speedSlider" min="10" max="100" value="40" step="10">
      <span id="speedVal">40 km/h</span>
    </div>
    <div id="stats">
      <div class="stat"><span class="stat-label">Coins</span><span class="stat-val" id="scoreEl">0/100</span></div>
      <div class="stat"><span class="stat-label">Best</span><span class="stat-val" id="hiEl">0</span></div>
    </div>
    <button id="startBtn" onclick="toggleGame()">START</button>
  </div>
  <p id="keys-hint">← → Arrow keys &nbsp;|&nbsp; A / D keys &nbsp;|&nbsp; Touch swipe</p>
</div>

<script>
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
const W = 480, H = 580;
canvas.width = W; canvas.height = H;

// ---- State ----
let state = 'idle'; // idle | running | over | finish
let score = 0, hiScore = 0, frame = 0;
let kmh = 40; // 10~100 km/h

// ---- Road geometry ----
const RL = 100, RR = 380, RW = RR - RL;
const LC = (RL + RR) / 2;

// ---- Distance / Finish ----
// 100 km/h → getSpeed()=10 px/frame @60fps → 600 px/s
// 1 min at 100 km/h = 60s × 600 px/s = 36000 total game pixels
const FINISH_DIST = 36000;
const COIN_SET_TOTAL = 100;
let distTravelled = 0;
let finishLineY = null;
let finishOffset = 0;
let elapsedSec = 0;
let finalScore = 0;
let hiFinishScore = 0;
let coinSetSpawned = false; // unused, kept for reset compat
let nextCoinMilestone = 0;  // next 10%-milestone index to schedule (0–9)
let pendingCoins = [];      // coins waiting to spawn when distTravelled >= triggerDist

// ---- Car ----
let car = { x: LC, y: H - 110, w: 38, h: 68 };
const CSPEED = 5.5;

// ---- Road objects ----
let dashes = [], trees = [], obstacles = [], particles = [], coins = [];
let obstTimer = 0, coinTimer = 0;
let coinScore = 0;

// px/frame: at 100 km/h → 10 px/frame; linear
function getSpeed() { return kmh / 10; }

document.getElementById('speedSlider').oninput = function() {
  kmh = +this.value;
  document.getElementById('speedVal').textContent = kmh + ' km/h';
};

function toggleGame() {
  if (state === 'idle' || state === 'over' || state === 'finish') startGame();
  else endGame('STOPPED');
}

function startGame() {
  state = 'running';
  score = 0; frame = 0;
  car = { x: LC, y: H - 110, w: 38, h: 68 };
  obstacles = []; particles = []; coins = []; obstTimer = 0; coinTimer = 0; coinScore = 0;
  distTravelled = 0; finishLineY = null; finishOffset = 0; elapsedSec = 0; finalScore = 0;
  coinSetSpawned = false; nextCoinMilestone = 0; pendingCoins = [];
  // Pre-schedule all 100 coins across 10 segments
  for (let b = 0; b < 10; b++) scheduleCoinBatch(b);
  document.getElementById('scoreEl').textContent = '0';
  document.getElementById('hiEl').textContent = hiFinishScore;
  dashes = Array.from({length:10}, (_,i) => ({ y: i * 72 - 20 }));
  trees = [];
  for (let i = 0; i < 10; i++) spawnTree(i * 75 - 40);
  document.getElementById('startBtn').textContent = 'STOP';
}

function endGame(reason) {
  if (reason === 'FINISH') {
    state = 'finish';
    // 만점: 100km/h(60초)로 코인 100개 = 60점
    // 점수 = (60 / 통과시간) × 60 × (코인/100)
    const speedRatio = 60 / elapsedSec;
    finalScore = Math.round(speedRatio * 60 * (coinScore / COIN_SET_TOTAL) * 10) / 10;
    if (finalScore > hiFinishScore) hiFinishScore = finalScore;
    document.getElementById('hiEl').textContent = hiFinishScore;
    spawnFinishCelebration(car.x, car.y);
  } else {
    state = 'over';
    // 중간 게임오버: 진행률 × (60/환산시간) × 60 × (코인/100)
    // 환산시간 = 간 거리를 현재 속도로 가는 데 걸리는 시간 ≈ elapsedSec
    const progressRatio = distTravelled / FINISH_DIST;
    const speedRatio = progressRatio > 0 ? (progressRatio * 60) / elapsedSec : 0;
    finalScore = Math.round(speedRatio * 60 * (coinScore / COIN_SET_TOTAL) * 10) / 10;
    spawnCrash(car.x, car.y);
  }
  document.getElementById('startBtn').textContent = 'RETRY';
}

function spawnFinishCelebration(x, y) {
  const confCols = ['#ff3c00','#ffdd57','#00e5ff','#ff69b4','#7fff00','#fff'];
  for (let i = 0; i < 60; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 2 + Math.random() * 5;
    particles.push({ x: RL + Math.random()*RW, y: Math.random()*H*0.6, vx: Math.cos(a)*s*0.6, vy: Math.sin(a)*s*0.6 - 2, life: 1, col: confCols[Math.floor(Math.random()*confCols.length)], size: 4+Math.random()*5 });
  }
}

// ---- Spawners ----
function spawnTree(startY) {
  const side = Math.random() < 0.5 ? 'L' : 'R';
  const x = side === 'L' ? 18 + Math.random() * 60 : RR + 20 + Math.random() * 60;
  trees.push({ x, y: startY ?? -40, h: 28 + Math.random() * 18, side, col: `hsl(${118+Math.random()*18},${38+Math.random()*15}%,${22+Math.random()*12}%)` });
}

function spawnObstacle() {
  const laneX = [RL + 50, LC, RR - 50];
  const x = laneX[Math.floor(Math.random() * 3)] + (Math.random()-0.5)*20;
  const cols = ['#c8312a','#1a5fa8','#1a7a4a','#b87010','#8a2070','#444466'];
  obstacles.push({ x, y: -80, w: 36, h: 64, col: cols[Math.floor(Math.random()*cols.length)], spd: getSpeed() * (0.65 + Math.random() * 0.45) });
}

function spawnCrash(x, y) {
  for (let i = 0; i < 32; i++) {
    const a = (i / 32) * Math.PI * 2;
    const s = 1.5 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(a)*s*(0.5+Math.random()), vy: Math.sin(a)*s*(0.5+Math.random()), life: 1, col: ['#ff3c00','#ffaa00','#fff','#ffdd55'][i%4], size: 3+Math.random()*5 });
  }
}

function scheduleCoinBatch(batchIndex) {
  // Schedule 10 coins evenly spread across this 10% segment
  const segStart = batchIndex * 0.1 * FINISH_DIST;
  const segEnd   = (batchIndex + 1) * 0.1 * FINISH_DIST;
  const segSize  = segEnd - segStart;
  const laneXOptions = [RL + 45, RL + 80, LC - 40, LC, LC + 40, RR - 80, RR - 45];

  for (let i = 0; i < 10; i++) {
    // Spread evenly + small random jitter so they're not perfectly spaced
    const t = (i + 0.5 + (Math.random() - 0.5) * 0.7) / 10;
    const triggerDist = segStart + t * segSize;
    const laneIdx = Math.floor(Math.random() * laneXOptions.length);
    pendingCoins.push({
      triggerDist,
      x: laneXOptions[laneIdx] + (Math.random() - 0.5) * 16,
    });
  }
  // Sort so we can pop from front cheaply
  pendingCoins.sort((a, b) => a.triggerDist - b.triggerDist);
}

function spawnCoinCollect(x, y) {
  for (let i = 0; i < 10; i++) {
    const a = (i / 10) * Math.PI * 2;
    particles.push({ x, y, vx: Math.cos(a)*2.5, vy: Math.sin(a)*2.5 - 1, life: 1, col: ['#ffdd57','#ffaa00','#ffe97a','#fff'][i%4], size: 2.5 + Math.random()*2, type: 'coin' });
  }
  // floating +1 text particle
  particles.push({ x, y, vx: 0, vy: -1.8, life: 1, col: '#ffdd57', size: 13, type: 'text' });
}
const keys = {};
document.addEventListener('keydown', e => { keys[e.key] = true; e.preventDefault && ['ArrowLeft','ArrowRight'].includes(e.key) && e.preventDefault(); });
document.addEventListener('keyup', e => { keys[e.key] = false; });

let touchX0 = null;
canvas.addEventListener('touchstart', e => { touchX0 = e.touches[0].clientX; e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove', e => {
  if (!touchX0) return;
  const dx = e.touches[0].clientX - touchX0;
  keys['ArrowLeft'] = dx < -8;
  keys['ArrowRight'] = dx > 8;
  e.preventDefault();
}, {passive:false});
canvas.addEventListener('touchend', () => { keys['ArrowLeft'] = keys['ArrowRight'] = false; touchX0 = null; });

// ---- Update ----
function update() {
  if (state !== 'running') {
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += (p.type === 'text' ? 0 : 0.08); p.life -= (p.type === 'text' ? 0.022 : 0.025); });
    particles = particles.filter(p => p.life > 0);
    return;
  }
  frame++;

  const spd = getSpeed();
  distTravelled += spd;

  // Move car
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) car.x -= CSPEED;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) car.x += CSPEED;
  car.x = Math.max(RL + car.w/2 + 2, Math.min(RR - car.w/2 - 2, car.x));

  // Off-road
  if (car.x - car.w/2 < RL + 1 || car.x + car.w/2 > RR - 1) { endGame('OFF ROAD'); return; }

  // Dashes
  dashes.forEach(d => { d.y += spd; if (d.y > H + 40) d.y -= 10 * 72; });

  // Trees
  trees.forEach(t => { t.y += spd * 0.85; });
  trees = trees.filter(t => t.y < H + 60);
  while (trees.length < 12) spawnTree();

  // Obstacles
  obstTimer++;
  const interval = Math.max(20, 80 - (kmh - 10) * 0.7);
  if (obstTimer >= interval) { spawnObstacle(); obstTimer = 0; }
  obstacles.forEach(o => { o.y += spd * 0.78; });
  obstacles = obstacles.filter(o => o.y < H + 100);

  // Elapsed time (approx 60fps)
  elapsedSec += 1 / 60;

  // Coins — spawn individually when distTravelled passes each coin's triggerDist
  while (pendingCoins.length > 0 && distTravelled >= pendingCoins[0].triggerDist) {
    const p = pendingCoins.shift();
    coins.push({ x: p.x, y: -20, r: 11, angle: Math.random() * Math.PI * 2, spin: 0.06 + Math.random() * 0.04 });
  }
  coins.forEach(c => { c.y += spd * 0.78; c.angle += c.spin; });
  coins = coins.filter(c => c.y < H + 30);
  for (let i = coins.length - 1; i >= 0; i--) {
    const c = coins[i];
    if (Math.abs(car.x - c.x) < car.w*0.5 + c.r && Math.abs(car.y - c.y) < car.h*0.5 + c.r) {
      coinScore = Math.min(coinScore + 1, COIN_SET_TOTAL);
      spawnCoinCollect(c.x, c.y);
      coins.splice(i, 1);
    }
  }

  // Finish line tracking
  const remaining = FINISH_DIST - distTravelled;
  if (remaining <= 0 && finishLineY !== null && finishLineY >= car.y) {
    endGame('FINISH'); return;
  }
  // Initialise finish line screen position once it's within view range
  if (finishLineY === null && remaining <= H * 30) {
    finishLineY = -remaining; // starts above screen, scrolls down each frame
  }
  if (finishLineY !== null) {
    finishLineY += spd;
  }

  // Particles
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += (p.type === 'text' ? 0 : 0.1); p.life -= (p.type === 'text' ? 0.022 : 0.032); });
  particles = particles.filter(p => p.life > 0);

  // Collision
  for (let o of obstacles) {
    if (Math.abs(car.x - o.x) < (car.w + o.w) * 0.43 && Math.abs(car.y - o.y) < (car.h + o.h) * 0.43) {
      endGame('CRASH'); return;
    }
  }

  document.getElementById('scoreEl').textContent = `${coinScore}/100`;
  document.getElementById('hiEl').textContent = hiFinishScore;
}

// ---- Draw helpers ----
function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

function lerpCol(a, b, t) {
  const pa = parseInt(a.slice(1), 16), pb = parseInt(b.slice(1), 16);
  const ar = (pa>>16)&255, ag = (pa>>8)&255, ab = pa&255;
  const br = (pb>>16)&255, bg = (pb>>8)&255, bb = pb&255;
  const r = Math.round(ar + (br-ar)*t), g = Math.round(ag + (bg-ag)*t), bv = Math.round(ab + (bb-ab)*t);
  return `rgb(${r},${g},${bv})`;
}

function drawRoad() {
  // Sky gradient (static)
  const sky = ctx.createLinearGradient(0, 0, 0, H * 0.18);
  sky.addColorStop(0, '#05050d');
  sky.addColorStop(1, '#0a0a18');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H * 0.18);

  // Horizon line
  ctx.fillStyle = '#0f0f22';
  ctx.fillRect(0, H * 0.18, W, 2);

  // Ground (perspective gradient)
  const gnd = ctx.createLinearGradient(0, H * 0.18, 0, H);
  gnd.addColorStop(0, '#3a6b2a');
  gnd.addColorStop(0.3, '#2e5522');
  gnd.addColorStop(1, '#1a3314');
  ctx.fillStyle = gnd;
  ctx.fillRect(0, H * 0.18, W, H);

  // Grass texture lines
  ctx.strokeStyle = 'rgba(0,0,0,0.12)';
  ctx.lineWidth = 1;
  for (let x = 0; x < RL; x += 12) { ctx.beginPath(); ctx.moveTo(x,H*0.18); ctx.lineTo(x,H); ctx.stroke(); }
  for (let x = RR; x < W; x += 12) { ctx.beginPath(); ctx.moveTo(x,H*0.18); ctx.lineTo(x,H); ctx.stroke(); }

  // Road surface
  const rdg = ctx.createLinearGradient(0, H * 0.18, 0, H);
  rdg.addColorStop(0, '#2a2a3a');
  rdg.addColorStop(0.5, '#303040');
  rdg.addColorStop(1, '#252535');
  ctx.fillStyle = rdg;
  ctx.fillRect(RL, 0, RW, H);

  // Road grain texture
  ctx.fillStyle = 'rgba(0,0,0,0.07)';
  for (let y = 0; y < H; y += 5) ctx.fillRect(RL, y, RW, 2.5);

  // Asphalt crack lines (static decoration)
  ctx.strokeStyle = 'rgba(255,255,255,0.025)';
  ctx.lineWidth = 0.5;
  [[LC-30, 80, LC-45, 200],[LC+25, 150, LC+40, 310],[LC-10, 340, LC+15, 480]].forEach(([x1,y1,x2,y2]) => {
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  });

  // Kerb stripes L & R
  for (let y = 0; y < H; y += 22) {
    const even = Math.floor(y / 22) % 2 === 0;
    ctx.fillStyle = even ? '#cc2222' : '#eeeeee';
    ctx.fillRect(RL - 14, y, 14, 22);
    ctx.fillStyle = even ? '#cc2222' : '#eeeeee';
    ctx.fillRect(RR, y, 14, 22);
  }
  // Kerb shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.fillRect(RL - 14, 0, 3, H);
  ctx.fillRect(RR + 11, 0, 3, H);

  // White edge lines
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(RL, 0); ctx.lineTo(RL, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(RR, 0); ctx.lineTo(RR, H); ctx.stroke();

  // Center lane dashes
  ctx.strokeStyle = '#ffdd57';
  ctx.lineWidth = 2;
  ctx.setLineDash([32, 26]);
  dashes.forEach(d => {
    ctx.beginPath(); ctx.moveTo(LC - RW/6, d.y); ctx.lineTo(LC - RW/6, d.y + 45); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(LC + RW/6, d.y); ctx.lineTo(LC + RW/6, d.y + 45); ctx.stroke();
  });
  ctx.setLineDash([]);
}

function drawTree(t) {
  const ts = t.h;
  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.18)';
  ctx.beginPath(); ctx.ellipse(t.x + 5, t.y + ts * 0.55, ts * 0.55, ts * 0.16, 0, 0, Math.PI*2); ctx.fill();
  // Trunk
  ctx.fillStyle = '#6b4520';
  ctx.fillRect(t.x - 4, t.y + ts * 0.28, 8, ts * 0.5);
  // Foliage 3 layers
  const g = t.col;
  const lighten = (c, a) => { ctx.globalAlpha = a; ctx.fillStyle = '#7fc855'; };
  ctx.fillStyle = g; ctx.globalAlpha = 1;
  ctx.beginPath(); ctx.arc(t.x, t.y + ts * 0.22, ts * 0.82, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = g; ctx.globalAlpha = 0.85;
  ctx.beginPath(); ctx.arc(t.x - ts*0.28, t.y, ts * 0.6, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#3d7a2a'; ctx.globalAlpha = 0.9;
  ctx.beginPath(); ctx.arc(t.x + ts*0.22, t.y - ts*0.05, ts * 0.62, 0, Math.PI*2); ctx.fill();
  // Highlight
  ctx.fillStyle = 'rgba(160,220,100,0.18)';
  ctx.beginPath(); ctx.arc(t.x - ts*0.2, t.y - ts*0.25, ts * 0.3, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;
}

function drawCar(x, y, w, h, col, isPlayer) {
  // Ground shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(x+3, y + h*0.44, w*0.46, h*0.12, 0, 0, Math.PI*2); ctx.fill();

  // Body
  ctx.fillStyle = col;
  rr(x - w/2, y - h/2, w, h, 7); ctx.fill();

  // Body highlight (top edge)
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  rr(x - w/2 + 2, y - h/2 + 2, w - 4, h * 0.22, 4); ctx.fill();

  // Cabin
  const cabCol = isPlayer ? '#1a3a5c' : '#1a2a40';
  ctx.fillStyle = cabCol;
  if (isPlayer) {
    rr(x - w*0.37, y - h*0.31, w*0.74, h*0.43, 5); ctx.fill();
  } else {
    rr(x - w*0.37, y - h*0.12, w*0.74, h*0.43, 5); ctx.fill();
  }

  // Windshield
  ctx.fillStyle = isPlayer ? 'rgba(140,210,255,0.82)' : 'rgba(120,180,230,0.65)';
  if (isPlayer) {
    rr(x - w*0.28, y - h*0.27, w*0.56, h*0.2, 3); ctx.fill();
    // Windshield reflection
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.beginPath(); ctx.ellipse(x - w*0.08, y - h*0.2, w*0.08, h*0.04, -0.3, 0, Math.PI*2); ctx.fill();
  } else {
    rr(x - w*0.28, y - h*0.08, w*0.56, h*0.2, 3); ctx.fill();
  }

  // Rear/front lights
  if (isPlayer) {
    // Headlights (bottom = front)
    ctx.fillStyle = '#ffee66';
    ctx.shadowColor = '#ffdd00'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.ellipse(x - w*0.3, y + h/2 - 9, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + w*0.3, y + h/2 - 9, 5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    // Taillights (top)
    ctx.fillStyle = '#cc1111';
    ctx.beginPath(); ctx.ellipse(x - w*0.3, y - h/2 + 9, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + w*0.3, y - h/2 + 9, 5, 3, 0, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = '#ff3333';
    ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 6;
    ctx.beginPath(); ctx.ellipse(x - w*0.3, y + h/2 - 9, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + w*0.3, y + h/2 - 9, 5, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Wheels
  const wheelPos = [[-w*0.38, -h*0.31],[w*0.38, -h*0.31],[-w*0.38, h*0.27],[w*0.38, h*0.27]];
  wheelPos.forEach(([dx,dy]) => {
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.ellipse(x+dx, y+dy, 7, 10, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.ellipse(x+dx, y+dy, 4, 6, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#666';
    ctx.beginPath(); ctx.arc(x+dx, y+dy, 2, 0, Math.PI*2); ctx.fill();
  });

  // Player racing stripe
  if (isPlayer) {
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    rr(x - w*0.1, y - h*0.46, w*0.2, h*0.38, 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,60,0,0.5)';
    rr(x - w*0.1 + 3, y - h*0.46, 4, h*0.38, 2); ctx.fill();
  }
}

function drawCoin(c) {
  const scaleX = Math.abs(Math.cos(c.angle));
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.scale(scaleX, 1);

  // Outer glow
  ctx.shadowColor = '#ffcc00';
  ctx.shadowBlur = 10;

  // Coin body
  const grad = ctx.createRadialGradient(-c.r*0.3, -c.r*0.3, 1, 0, 0, c.r);
  grad.addColorStop(0, '#fff7a0');
  grad.addColorStop(0.35, '#ffd700');
  grad.addColorStop(0.75, '#e6a800');
  grad.addColorStop(1, '#b87800');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(0, 0, c.r, 0, Math.PI*2); ctx.fill();

  ctx.shadowBlur = 0;

  // Inner ring
  ctx.strokeStyle = 'rgba(255,220,50,0.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(0, 0, c.r * 0.7, 0, Math.PI*2); ctx.stroke();

  // $ symbol
  ctx.fillStyle = '#b87800';
  ctx.font = `bold ${Math.round(c.r * 1.1)}px Orbitron, monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('$', 0, 1);
  ctx.textBaseline = 'alphabetic';

  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    if (p.type === 'text') {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.col;
      ctx.font = `bold ${p.size}px Orbitron, monospace`;
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 6;
      ctx.fillText('+1', p.x, p.y);
      ctx.shadowBlur = 0;
    } else {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.col;
      ctx.shadowColor = p.col; ctx.shadowBlur = 4;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI*2); ctx.fill();
      ctx.shadowBlur = 0;
    }
  });
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}

function drawHUD() {
  // Speed gauge box
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  rr(W - 104, 10, 94, 42, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(255,60,0,0.4)'; ctx.lineWidth = 0.5;
  rr(W - 104, 10, 94, 42, 6); ctx.stroke();
  ctx.fillStyle = '#ff3c00';
  ctx.font = 'bold 11px Orbitron, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`${kmh} km/h`, W - 57, 26);
  ctx.fillStyle = 'rgba(255,60,0,0.5)';
  ctx.font = '8px Orbitron, monospace';
  ctx.fillText('SPEED', W - 57, 40);

  // Coin score box
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  rr(10, 10, 90, 42, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(255,215,0,0.4)'; ctx.lineWidth = 0.5;
  rr(10, 10, 90, 42, 6); ctx.stroke();
  ctx.fillStyle = '#ffd700';
  ctx.shadowColor = '#ffcc00'; ctx.shadowBlur = 5;
  ctx.beginPath(); ctx.arc(28, 26, 7, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#b87800';
  ctx.font = 'bold 8px Orbitron, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('$', 28, 29);
  ctx.fillStyle = '#ffdd57';
  ctx.font = 'bold 13px Orbitron, monospace';
  ctx.fillText(`${coinScore}/100`, 68, 27);
  ctx.fillStyle = 'rgba(255,215,0,0.45)';
  ctx.font = '7px Orbitron, monospace';
  ctx.fillText('COINS', 68, 40);

  // Elapsed time box (center top)
  const mins = Math.floor(elapsedSec / 60);
  const secs = Math.floor(elapsedSec % 60);
  const timeStr = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  rr(W/2 - 42, 10, 84, 42, 6); ctx.fill();
  ctx.strokeStyle = 'rgba(100,200,255,0.3)'; ctx.lineWidth = 0.5;
  rr(W/2 - 42, 10, 84, 42, 6); ctx.stroke();
  ctx.fillStyle = '#aaddff';
  ctx.font = 'bold 14px Orbitron, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(timeStr, W/2, 28);
  ctx.fillStyle = 'rgba(100,200,255,0.45)';
  ctx.font = '7px Orbitron, monospace';
  ctx.fillText('TIME', W/2, 42);

  // Distance progress bar
  const pct = Math.min(distTravelled / FINISH_DIST, 1);
  const barX = 10, barY = 62, barW = W - 20, barH = 6;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  rr(barX, barY, barW, barH, 3); ctx.fill();
  // gradient fill
  const pgrad = ctx.createLinearGradient(barX, 0, barX + barW, 0);
  pgrad.addColorStop(0, '#1a8a3a');
  pgrad.addColorStop(0.6, '#44cc44');
  pgrad.addColorStop(1, '#ffdd57');
  ctx.fillStyle = pgrad;
  rr(barX, barY, Math.max(6, barW * pct), barH, 3); ctx.fill();
  // finish flag icon at end
  ctx.fillStyle = pct > 0.9 ? '#ffdd57' : 'rgba(255,255,255,0.3)';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('🏁', barX + barW + 12, barY + 8);
  // distance label
  const remM = Math.max(0, Math.round((FINISH_DIST - distTravelled) / 100));
  ctx.fillStyle = 'rgba(200,255,200,0.55)';
  ctx.font = '7px Orbitron, monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`${remM}m remaining`, barX, barY + 18);
  ctx.textAlign = 'left';
}

function drawFinishLine() {
  if (finishLineY === null || finishLineY > H + 20 || finishLineY < -20) return;
  const fy = finishLineY;
  const sqSize = 14;
  // Checkered pattern across full road width
  for (let xi = 0; xi < Math.ceil(RW / sqSize); xi++) {
    for (let yi = 0; yi < 2; yi++) {
      const dark = (xi + yi) % 2 === 0;
      ctx.fillStyle = dark ? '#111' : '#fff';
      ctx.fillRect(RL + xi * sqSize, fy + yi * sqSize - sqSize, sqSize, sqSize);
    }
  }
  // Glow line
  ctx.strokeStyle = 'rgba(255,255,100,0.7)';
  ctx.lineWidth = 2;
  ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 12;
  ctx.beginPath(); ctx.moveTo(RL - 14, fy); ctx.lineTo(RR + 14, fy); ctx.stroke();
  ctx.shadowBlur = 0;
  // FINISH label
  ctx.fillStyle = '#ffff55';
  ctx.font = 'bold 13px Orbitron, monospace';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#ffff00'; ctx.shadowBlur = 8;
  ctx.fillText('FINISH', LC, fy - 6);
  ctx.shadowBlur = 0;
  ctx.textAlign = 'left';
}

function drawScoreCard(isFinish) {
  const coinRatio = (coinScore / COIN_SET_TOTAL).toFixed(2);
  const cardCol = isFinish ? 'rgba(255,221,87,0.18)' : 'rgba(255,80,80,0.12)';
  const borderCol = isFinish ? 'rgba(255,221,87,0.35)' : 'rgba(255,100,100,0.3)';

  ctx.fillStyle = cardCol;
  rr(W/2 - 170, H/2 - 64, 340, 158, 10); ctx.fill();
  ctx.strokeStyle = borderCol; ctx.lineWidth = 0.8;
  rr(W/2 - 170, H/2 - 64, 340, 158, 10); ctx.stroke();

  ctx.font = '9px Orbitron, monospace';
  ctx.textAlign = 'center';

  if (isFinish) {
    const speedRatio = 60 / elapsedSec;
    const mins = Math.floor(elapsedSec / 60);
    const secs = Math.floor(elapsedSec % 60);
    const timeStr = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;

    ctx.fillStyle = 'rgba(200,200,255,0.55)';
    ctx.fillText('점수 = (60초 ÷ 통과시간) × 60 × (코인/100)', W/2, H/2 - 42);

    ctx.fillStyle = '#aaddff';
    ctx.font = '11px Orbitron, monospace';
    ctx.fillText(`(60 ÷ ${Math.floor(elapsedSec)}초) × 60 × ${coinScore}/100`, W/2, H/2 - 18);

    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = '10px Orbitron, monospace';
    ctx.fillText(`= ${speedRatio.toFixed(3)} × 60 × ${coinRatio}`, W/2, H/2 + 4);
  } else {
    const progressRatio = distTravelled / FINISH_DIST;
    const speedRatio = progressRatio > 0 ? (progressRatio * 60) / elapsedSec : 0;
    const pct = (progressRatio * 100).toFixed(1);

    ctx.fillStyle = 'rgba(200,200,255,0.55)';
    ctx.fillText('점수 = (진행%×60초 ÷ 경과시간) × 60 × (코인/100)', W/2, H/2 - 42);

    ctx.fillStyle = '#ffbbaa';
    ctx.font = '11px Orbitron, monospace';
    ctx.fillText(`(${pct}%×60 ÷ ${Math.floor(elapsedSec)}초) × 60 × ${coinScore}/100`, W/2, H/2 - 18);

    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = '10px Orbitron, monospace';
    ctx.fillText(`= ${speedRatio.toFixed(3)} × 60 × ${coinRatio}`, W/2, H/2 + 4);
  }

  // divider
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(W/2 - 110, H/2 + 14, 220, 0.5);

  // Final score
  const scoreCol = isFinish ? '#ffdd57' : '#ff9966';
  ctx.fillStyle = scoreCol;
  ctx.font = 'bold 34px Orbitron, monospace';
  ctx.shadowColor = scoreCol; ctx.shadowBlur = 16;
  ctx.fillText(`${finalScore} pts`, W/2, H/2 + 52);
  ctx.shadowBlur = 0;

  ctx.font = '8px Orbitron, monospace';
  ctx.fillStyle = 'rgba(200,200,255,0.3)';
  ctx.fillText('만점 60pts  (100km/h + 코인 100개)', W/2, H/2 + 68);

  if (isFinish && finalScore >= hiFinishScore && finalScore > 0) {
    ctx.fillStyle = '#ff3c00';
    ctx.font = 'bold 10px Orbitron, monospace';
    ctx.fillText('★  NEW BEST  ★', W/2, H/2 + 84);
  } else {
    ctx.fillStyle = 'rgba(200,200,255,0.35)';
    ctx.font = '9px Orbitron, monospace';
    ctx.fillText(`BEST  ${hiFinishScore} pts`, W/2, H/2 + 84);
  }
}

function drawOverlay(msg, sub, isFinish) {
  ctx.fillStyle = 'rgba(0,0,0,0.80)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';

  const titleCol = isFinish ? '#ffdd57' : '#ff3c00';
  ctx.fillStyle = titleCol;
  ctx.font = 'bold 36px Orbitron, monospace';
  ctx.shadowColor = titleCol; ctx.shadowBlur = 18;
  ctx.fillText(msg, W/2, H/2 - 88);
  ctx.shadowBlur = 0;

  if (state === 'over' || state === 'finish') {
    drawScoreCard(isFinish);
  } else {
    if (sub) {
      ctx.fillStyle = 'rgba(200,200,255,0.75)';
      ctx.font = '12px Orbitron, monospace';
      ctx.fillText(sub, W/2, H/2 + 10);
    }
  }

  ctx.textAlign = 'left';
}

// ---- Main loop ----
function loop() {
  update();

  ctx.clearRect(0, 0, W, H);
  drawRoad();
  trees.sort((a,b) => a.y - b.y).forEach(drawTree);
  drawFinishLine();
  obstacles.forEach(o => drawCar(o.x, o.y, o.w, o.h, o.col, false));
  coins.forEach(drawCoin);
  if (state !== 'idle') drawCar(car.x, car.y, car.w, car.h, '#d42020', true);
  drawParticles();

  if (state === 'running') drawHUD();
  if (state === 'idle') drawOverlay('ROAD RUSH', '← → 키로 조종 | 도로 이탈 / 충돌 시 게임 오버', false);
  if (state === 'over') drawOverlay('GAME OVER', null, false);
  if (state === 'finish') drawOverlay('🏁 GOAL!', null, true);

  requestAnimationFrame(loop);
}

loop();
</script>
